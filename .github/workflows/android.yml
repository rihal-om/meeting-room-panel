name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Cimon runtime security
        uses: rihal-om/.github/.github/actions/setup-cimon@main
        continue-on-error: true
        with:
          mode: detect
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit + screenshot tests, lint, build
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            android/app/build/reports/
            android/app/build/outputs/apk/debug/
